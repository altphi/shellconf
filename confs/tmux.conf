setw -g xterm-keys on
set-option -g history-limit 10000
set-option -g mouse on

set -g prefix C-Space
bind -n C-Space send-prefix

set -g extended-keys on
set -g extended-keys-format xterm
set -g default-terminal "tmux-256color"
set -g terminal-features[100] 'xterm-ghostty:RGB:extkeys'

bind -n M-k clear-history
bind -n C-k clear-history

bind j split-window -c "#{pane_current_path}"
bind k split-window -b -c "#{pane_current_path}"

bind l split-window -h -f -c "#{pane_current_path}"
bind h split-window -b -h -f -c "#{pane_current_path}"

bind Space new-window -c "#{pane_current_path}"
bind -T prefix q display-panes -d 0
bind O run-shell "~/bin/tmux-open-link.sh"
bind C-r source-file "~/.tmux.conf" \; display "reloaded"
bind X detach-client \; kill-session

bind S run-shell "~/bin/old-tmux-session-switcher.sh"

# basically all this gradually reinvented choose-tree but...
# adds "mru" at the pane-level
# adds path to the list for typeahead find
# automatically creates new session/window/pane by typed-in-but-not-found-extant-name

bind Tab last-window
bind s display-popup -E -w 90% -h 80% -T " sessions " "~/bin/tmux-session-switcher.sh"
bind w display-popup -E -w 90% -h 80% -T " windows " "~/bin/tmux-window-switcher.sh --all"
bind p display-popup -E -w 90% -h 80% -T " panes " "~/bin/tmux-pane-switcher.sh --all"

## panes for current session
#bind t display-popup -E -w 90% -h 80% -T " panes " "~/bin/tmux-pane-switcher.sh"

set-option -g status off
bind e set-option status

# move panes around
bind ! break-pane -ad
bind | move-pane -h -f -t :.+
bind H move-pane -v -t "{left-of}"
bind L move-pane -v -t "{right-of}"
bind m choose-tree -wZ "join-pane -t '%%'"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

set -g tiled-layout-max-columns 2

set -g copy-mode-selection-style 'bg=colour238,fg=colour255'
set -g copy-mode-position-style 'bg=colour238,fg=colour250'

set -g initial-repeat-time 800
set -g repeat-time 350

bind-key -n M-n next-window
bind-key -n M-p previous-window

bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'Morantron/tmux-fingers'

# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @resurrect-capture-pane-contents 'off'
# set -g @resurrect-save-dir 'on'
# set -g @resurrect-processes 'nvim ncspot todui'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '0'  # 0 is disabled, >0 is number of minutes
# set -g @resurrect-save 'Z'
# set -g @resurrect-restore 'R'

set -g monitor-bell off
set -g visual-bell off
set -g visual-activity off
set -g monitor-activity off
set -g bell-action other

set -g allow-passthrough on
set -g pane-base-index 1
set -g base-index 1
setw -g mode-keys vi
set -g @scroll-speed-num-lines-per-scroll 1


set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

set -g mouse on
set -g detach-on-destroy off
# to unset a hook, run set-hook -gu hook-name
# set-hook -g session-closed 'run-shell ~/bin/tmux-session-switcher.sh'

# enter resize mode
bind r set -F @resize_previous_status '#{status}' \; set status on \; set -g key-table resize

# resize keys (no prefix)
bind -T resize h resize-pane -L 5
bind -T resize j resize-pane -D 5
bind -T resize k resize-pane -U 5
bind -T resize l resize-pane -R 5
bind -T resize 2 run-shell 'tmux resize-pane -x $(( $(tmux display -p "#{window_width}") / 2 ))'
bind -T resize 3 run-shell 'tmux resize-pane -x $(( $(tmux display -p "#{window_width}") / 3 ))'
bind -T resize = select-layout -E
bind = select-layout -E

# exit resize mode
bind -T resize q set -g key-table root \; set -F status '#{@resize_previous_status}' \; set -u @resize_previous_status
bind -T resize Escape set -g key-table root \; set -F status '#{@resize_previous_status}' \; set -u @resize_previous_status

bind ? display-popup -E -w 95% -h 90% "tmux list-keys -a | less -R"
# bind Tab switch-client -l

# status bar
set -g focus-events on
set -g status-style bg=default
set -g status-left-length 300
set -g status-right-length 99
set -g status-interval 60
set -g status-justify absolute-centre
set -g status-left "#{?#{==:#{client_key_table},resize},#[fg=colour0#,bg=colour220#,bold] RESIZE #[default] ,}#{?client_prefix,#[reverse],}[#{session_name}]#[default]#{?#{==:#{pane_current_command},nvim}, #{@nvim_diagnostic_status},}#[default]"
set -g status-right "#(~/bin/vol-status.sh) | #(~/bin/bat-status.sh) | %Y-%m-%d %H:%M"

set -g scroll-on-clear on
set -g remain-on-exit failed

# active pane stuff
set -g pane-border-indicators arrows
set -g pane-border-status off
set -g pane-border-lines spaces

# set -g pane-border-style "dim align=right fill=colour3"
# set -g pane-active-border-style "bold align=right"
# set -g pane-border-format '#{?pane_active,-------#{pane_current_command}-------,--}'

set -g window-style 'bg=terminal'
# TODO figure out how to flip or set based on ghostty theme changes or darkman
#light
set -g window-active-style 'bg=#ffffff'
#dark
set -gu window-active-style 'bg=#09141b'
set -gu window-style 'bg=#091422'

# for sorting mru pane activity
set -gF @pane_mru_seq '#{?#{@pane_mru_seq},#{@pane_mru_seq},0}'

set-hook -g window-pane-changed \
  'set -pF @pane_mru "#{e|+:#{@pane_mru_seq},1}" ; set -gF @pane_mru_seq "#{e|+:#{@pane_mru_seq},1}"'

set-hook -g session-window-changed \
  'set -pF @pane_mru "#{e|+:#{@pane_mru_seq},1}" ; set -gF @pane_mru_seq "#{e|+:#{@pane_mru_seq},1}"'

set-hook -g client-session-changed \
  'set -pF @pane_mru "#{e|+:#{@pane_mru_seq},1}" ; set -gF @pane_mru_seq "#{e|+:#{@pane_mru_seq},1}"'

run -b '~/.tmux/plugins/tpm/tpm'
