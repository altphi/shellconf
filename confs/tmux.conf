setw -g xterm-keys on
set-option -g history-limit 10000
set-option -g mouse on
bind -n M-k clear-history
bind -n C-k clear-history
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -f -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -T prefix q display-panes -d 0
bind t choose-tree -sZ -O time
bind-key s run-shell "~/bin/tmux-session-switcher.sh"
bind-key O run-shell "~/bin/tmux-open-link.sh"
bind-key -r C-right run-shell 'tmux resize-pane -x $(( $(tmux display -p "#{window_width}") / 3 ))'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-save-dir 'on'
set -g @resurrect-processes 'vim nvim btop ssh spotify_player'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

run -b '~/.tmux/plugins/tpm/tpm'

set -g allow-passthrough on
set -g pane-base-index 1
set -g base-index 1
setw -g mode-keys vi
set -g @scroll-speed-num-lines-per-scroll 1
set -g default-terminal "linux"
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g mouse on

