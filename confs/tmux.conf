setw -g xterm-keys on
set-option -g history-limit 10000
set-option -g mouse on
bind -n M-k clear-history
bind -n C-k clear-history
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -f -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind -T prefix q display-panes -d 0
bind t choose-tree -sZ -O time
bind S run-shell "~/bin/tmux-session-switcher.sh"
bind s run-shell "~/bin/tmux-process-switcher.sh"
bind O run-shell "~/bin/tmux-open-link.sh"
bind C-r source-file "~/.tmux.conf" \; display "reloaded"
bind X detach-client \; kill-session

set-option -g status off
bind e set-option status

# move panes around
bind ! break-pane -ad
bind m choose-tree -wZ "join-pane -t '%%'"

# swap pane with visual neighbor
bind l select-pane -R \; swap-pane -s '!' \; select-pane -t '!'
bind h select-pane -L \; swap-pane -s '!' \; select-pane -t '!'
bind j select-pane -D \; swap-pane -s '!' \; select-pane -t '!'
bind k select-pane -U \; swap-pane -s '!' \; select-pane -t '!'

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

set -g tiled-layout-max-columns 2

set -g copy-mode-selection-style 'bg=colour238,fg=colour255'
set -g copy-mode-position-style 'bg=colour238,fg=colour250'

set -g initial-repeat-time 800
set -g repeat-time 350

bind-key -n M-n next-window
bind-key -n M-p previous-window

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @resurrect-capture-pane-contents 'off'
# set -g @resurrect-save-dir 'on'
# set -g @resurrect-processes 'vim nvim btop ssh spotify_player'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '15'
# set -g @resurrect-save 'Z'
# set -g @resurrect-restore 'R'

set -g monitor-bell off
set -g visual-bell off
set -g visual-activity off
set -g monitor-activity off
set -g bell-action other

run -b '~/.tmux/plugins/tpm/tpm'

set -g allow-passthrough on
set -g pane-base-index 1
set -g base-index 1
setw -g mode-keys vi
set -g @scroll-speed-num-lines-per-scroll 1
#set -g default-terminal "tmux-256color"
#set -as terminal-features ',xterm-256color:RGB'
set -gu default-terminal
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

set -g mouse on
set -g detach-on-destroy off
# to unset a hook, run set-hook -gu hook-name
# set-hook -g session-closed 'run-shell ~/bin/tmux-session-switcher.sh'

# enter resize mode
bind r set -g key-table resize

# resize keys (no prefix)
bind -T resize h resize-pane -L 5
bind -T resize j resize-pane -D 5
bind -T resize k resize-pane -U 5
bind -T resize l resize-pane -R 5
bind -T resize 2 run-shell 'tmux resize-pane -x $(( $(tmux display -p "#{window_width}") / 2 ))'
bind -T resize 3 run-shell 'tmux resize-pane -x $(( $(tmux display -p "#{window_width}") / 3 ))'
bind -T resize = select-layout -E
bind = select-layout -E

# exit resize mode
bind -T resize q set -g key-table root
bind -T resize Escape set -g key-table root

bind ? display-popup -E -w 95% -h 90% "tmux list-keys -a | less -R"
bind Tab switch-client -l

# status bar
set -g status-left-length 30
set -g status-right-length 50
set -g status-right "#(/home/stephen/bin/vol-status) | Bat:#(upower -i /org/freedesktop/UPower/devices/battery_BAT0 | grep percentage | awk '{print $2}') | %Y-%m-%d %H:%M"
set -g status-interval 60
set -g status-left '#{?#{==:#{client_key_table},resize},#[fg=colour0#,bg=colour220#,bold] RESIZE #[default] ,}#{?client_prefix,#[reverse],}[#{session_name}]#[default] '
set -g status-style "bg=terminal dim"

set -g scroll-on-clear on
set -g remain-on-exit failed

# active pane stuff
set -g pane-border-indicators both
set -g pane-border-status off
set -g pane-border-lines spaces

# set -g pane-border-style "dim align=right fill=colour3"
# set -g pane-active-border-style "bold align=right"
# set -g pane-border-format '#{?pane_active,-------#{pane_current_command}-------,--}'

set -g window-style 'bg=terminal'
# TODO figure out how to flip or set based on ghostty theme changes or darkman
#light
set -g window-active-style 'bg=#ffffff'
#dark
set -gu window-active-style 'bg=#09141b'
set -gu window-style 'bg=#091422'

